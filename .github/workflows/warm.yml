name: warm

# caches made on a tag ref are invisible to the next tag, so the default branch
# builds once and every release restores from here
on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/src-tauri/**"
      - "bun.lock"
      - ".github/workflows/warm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: cache bun modules
        uses: actions/cache@v6
        with:
          # only the global store: bun links node_modules into it, and those
          # links do not survive a cache round trip
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: cache the built frontend
        uses: actions/cache@v6
        with:
          path: |
            apps/desktop/.svelte-kit
            apps/desktop/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/desktop/vite.config.ts') }}-${{ hashFiles('apps/desktop/src/**', 'packages/ui/src/**') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/desktop/vite.config.ts') }}-
            vite-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: cache cargo and the rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-all-crates: true
          cache-on-failure: true

      # plain cargo build skips tauri/custom-protocol, which tauri build turns on
      - name: build the app the way the release does
        working-directory: apps/desktop
        run: bun run tauri build --no-bundle
