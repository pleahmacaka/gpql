name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bunx biome ci --error-on-warnings

      - name: build the desktop frontend
        run: bun run --filter desktop build

      - run: bun run check

      - run: bun run test

  rust:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: build the desktop frontend
        run: bun run --filter desktop build

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: clippy

      - name: cache cargo and the rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
