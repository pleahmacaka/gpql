name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: tag to publish, for example 0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: cache bun modules
        uses: actions/cache@v5
        with:
          # only the global store: bun links node_modules into it, and those
          # links do not survive a cache round trip
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: cache the built frontend
        uses: actions/cache@v5
        with:
          path: |
            apps/desktop/.svelte-kit
            apps/desktop/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/desktop/vite.config.ts') }}-${{ hashFiles('apps/desktop/src/**', 'packages/ui/src/**') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/desktop/vite.config.ts') }}-
            vite-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - name: cache cargo and the rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-all-crates: true
          cache-on-failure: true

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: GPQL ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 1
