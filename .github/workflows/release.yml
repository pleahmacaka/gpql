name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: tag to publish, for example 0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  windows:
    needs: checks
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: cache bun modules
        uses: actions/cache@v6
        with:
          # only the global store: bun links node_modules into it, and those
          # links do not survive a cache round trip
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: cache the built frontend
        uses: actions/cache@v6
        with:
          path: |
            apps/desktop/.svelte-kit
            apps/desktop/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/desktop/vite.config.ts') }}-${{ hashFiles('apps/desktop/src/**', 'packages/ui/src/**') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/desktop/vite.config.ts') }}-
            vite-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: cache cargo and the rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-all-crates: true
          cache-on-failure: true

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: GPQL ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 1
