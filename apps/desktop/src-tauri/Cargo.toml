[package]
name = "app"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-postgres = "0.7.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "6.0.0"
tauri-plugin-opener = "2.5.4"
rand = "0.9.5"
tree-sitter = "0.26.13"
tree-sitter-sequel = "0.3.11"
sha2 = "0.10.9"
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.43", features = ["ring"] }
webpki-roots = "1.0.9"
redis = { version = "0.32.2", default-features = false, features = ["tokio-comp"] }
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls-no-provider"] }
tree-sitter-cypher = "0.2.6"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
duckdb = { version = "1.3.2", features = ["bundled"] }
tauri-plugin-dialog = "2.7.2"
libsql = { version = "0.9", default-features = false, features = ["remote"] }
clickhouse = { version = "0.15", default-features = false, features = ["rustls-tls"] }
neo4rs = "0.8"
snowflake-api = "0.14"
influxdb3-client = "0.2"
influxdb2 = "0.5"
influxdb2-structmap = "0.2"
arrow-cast = { version = "57", default-features = false }
csv = "1.4.0"
russh = "0.45"
async-trait = "0.1.92"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
